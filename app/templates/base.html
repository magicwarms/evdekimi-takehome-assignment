<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} &mdash; Real Estate AI</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0;
           background: #f6f7f9; color: #1a1a1a; }
    header { background: #1f2937; color: #fff; padding: 14px 24px; }
    header a { color: #d1d5db; text-decoration: none; margin-right: 18px; font-size: 14px; }
    header a:hover { color: #fff; }
    main { padding: 24px; max-width: 1040px; }
    h1 { font-size: 20px; margin-top: 28px; }
    h1:first-child { margin-top: 0; }
    table { border-collapse: collapse; width: 100%; background: #fff; font-size: 14px;
            border: 1px solid #e5e7eb; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb;
             vertical-align: top; }
    th { background: #f3f4f6; font-weight: 600; }
    .cards { display: flex; gap: 12px; flex-wrap: wrap; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
            padding: 16px 20px; min-width: 130px; }
    .card b { display: block; font-size: 26px; }
    .card span { color: #6b7280; font-size: 13px; }
    textarea { width: 100%; height: 320px; font-family: ui-monospace, Consolas, monospace;
               font-size: 13px; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { background: #2563eb; color: #fff; border: 0; padding: 8px 16px;
             border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1d4ed8; }
    .role-user { color: #2563eb; font-weight: 600; }
    .role-assistant { color: #059669; font-weight: 600; }
    .role-tool { color: #b45309; font-weight: 600; }
    td.tool-json { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
                   color: #78350f; max-width: 620px; word-break: break-word; }
    .ok { background: #dcfce7; padding: 8px 12px; border-radius: 6px;
          border: 1px solid #86efac; }
    .muted { color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <a href="/admin">Dashboard</a>
    <a href="/admin/conversations">Conversations</a>
    <a href="/admin/prompt">Prompt</a>
    <a href="/admin/properties">Properties &amp; Bookings</a>
    <a href="/admin/escalations">Escalations</a>
    <a href="/docs">API docs</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
